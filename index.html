<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pheno-Quest — La quête du diplôme magique</title>
  <meta name="description" content="Le jeu de plateforme des doctorants de l'équipe PhenoMEn (UMR AGAP Institut, CIRAD / INRAE) : choisis ton doctorant, survis à sa thèse et décroche la soutenance !" />
  <!-- Apercu des liens partages (Open Graph / Twitter) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Pheno-Quest" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:url" content="https://gbeurier.github.io/pheno-quest/" />
  <meta property="og:title" content="Pheno-Quest — La quête du diplôme magique" />
  <meta property="og:description" content="Le jeu de plateforme des doctorants de l'équipe PhenoMEn (UMR AGAP Institut, CIRAD / INRAE) : choisis ton doctorant, survis à sa thèse et décroche la soutenance !" />
  <meta property="og:image" content="https://gbeurier.github.io/pheno-quest/assets/sprites/bg_title.jpg" />
  <meta property="og:image:alt" content="Pheno-Quest : paysage pixel-art, collines et cabane du CIRAD sous le soleil" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pheno-Quest — La quête du diplôme magique" />
  <meta name="twitter:description" content="Le jeu de plateforme des doctorants de l'équipe PhenoMEn (UMR AGAP Institut, CIRAD / INRAE) : choisis ton doctorant, survis à sa thèse et décroche la soutenance !" />
  <meta name="twitter:image" content="https://gbeurier.github.io/pheno-quest/assets/sprites/bg_title.jpg" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #1b2330;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; overflow: hidden;
    }
    canvas { image-rendering: auto; box-shadow: 0 10px 40px rgba(0,0,0,.5); border-radius: 8px; }
    #note { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
            color: #6b7686; font-size: 12px; }
  </style>
</head>
<body>
  <!-- Moteur (embarque en local, aucune connexion requise) -->
  <script src="engine/kaplay.js"></script>
  <!-- Assets embarques en base64 (le jeu marche sans serveur, en file://).
       Genere par gen_assets_data.py. Si absent, le jeu charge depuis assets/. -->
  <script src="js/assets_data.js"></script>
  <!-- Donnees : reglages puis niveaux -->
  <script src="js/config.js"></script>
  <!-- Grilles ASCII des niveaux (source = levels/*.txt, embarquees par
       gen_levels_data.py). AVANT level.js qui lit window.LEVEL_MAPS. -->
  <script src="js/levels_data.js"></script>
  <script src="js/level.js"></script>
  <!-- Registre des PNJ (prenom/nom/taille/phrases par tete). AVANT game.js
       qui lit window.NPC pour la taille (et demain les phrases) des passants. -->
  <script src="js/npc.js"></script>
  <!-- Aventures et personnages : avant les sauvegardes et le moteur. -->
  <script src="js/campaigns.js"></script>
  <script src="js/characters.js"></script>
  <!-- Sauvegardes (3 slots) + IA des boss -->
  <script src="js/save.js"></script>
  <script src="js/bosses.js"></script>
  <!-- Lecteur MIDI chiptune (window.LQ_MUSIC). APRES assets_data.js ET config.js
       (il capture window.ASSETS.music + window.CONFIG a son chargement),
       AVANT game.js (qui libere window.ASSETS). -->
  <script src="js/music.js"></script>
  <!-- Manette tactile (web mobile) : detection + overlay. AVANT game.js car il
       pose window.LQ_TOUCH que kaplay() lit pour activer le letterbox mobile. -->
  <script src="js/mobile.js"></script>
  <!-- Jeu -->
  <script src="js/game.js"></script>
  <div id="note">Pheno-Quest — Le jeu des doctorants de l'équipe PhenoMEn (UMR AGAP Institut, CIRAD / INRAE) · <a href="https://gbeurier.github.io/pheno-quest/" style="color:inherit">gbeurier.github.io/pheno-quest</a></div>
</body>
</html>
